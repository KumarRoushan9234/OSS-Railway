# Every pull request: run all checks.
# Every push to main: run all checks, then release automatically:
#   1. pick the next version from commit messages since the last tag
#      (feat: or breaking change -> minor, anything else -> patch; v0.1.0 first)
#   2. create the tag and GitHub Release with generated notes
#   3. attach Linux binaries + install.sh + checksums
#   4. publish the panel image to GitHub Packages (:latest, :X.Y.Z, :sha-<commit>)
#   5. build the desktop app (Windows, macOS, Linux installers) onto the release
#   6. (npm.yml) publish the npm installer after this workflow, if that version isn't on npm yet
# Pushes that only change docs or the website skip the release.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Release the current commit even if nothing changed since the last release (bumps the patch number)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: sh scripts/check.sh

  version:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # "Re-run all jobs" replays the same commit, so it finds nothing new and skips the release.
          # To release again without a new commit: Actions -> ci -> Run workflow -> tick "force".
          if [ "$FORCE" != "true" ] && [ -z "$(git diff --name-only "$last" HEAD | grep -vE '^(docs/|site/)|\.md$' || true)" ]; then
            echo "Only docs or site changed since $last (or nothing changed); no release. Use Run workflow with force to release anyway."; exit 0
          fi
          log=$(git log --format='%s%n%b' "$last..HEAD")
          ver=${last#v}; major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}; patch=${rest#*.}
          if echo "$log" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE|^feat(\(.+\))?:'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.version != ''
        run: gh release create "v${{ steps.next.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.next.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  binaries:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd web && npm ci && npm run build
      - run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/oss-railway-linux-$arch" .
          done
          cp install.sh dist/
          (cd dist && sha256sum * > checksums.txt)
      - run: gh release upload "v${{ needs.version.outputs.version }}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/kumarroushan9234/oss-railway:latest
            ghcr.io/kumarroushan9234/oss-railway:${{ needs.version.outputs.version }}
            ghcr.io/kumarroushan9234/oss-railway:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  desktop:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Set the desktop app version
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          V="$v" perl -pi -e 's/"version": "[0-9.]*"/"version": "$ENV{V}"/' desktop/tauri.conf.json
          V="$v" perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{V}"/m' desktop/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v${{ needs.version.outputs.version }}
          releaseName: v${{ needs.version.outputs.version }}
