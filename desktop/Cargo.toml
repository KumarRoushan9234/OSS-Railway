[package]
name = "oss-railway-desktop"
version = "0.1.0"
edition = "2021"
description = "Manage OSS Railway servers from your computer"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native", "sync-secret-service"] }
url = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
